name: 🐍 Generate Contribution Snake

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate light snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MindfulTechie-06
          outputs: |
            dist/github-snake.svg?color_snake=%2310B981&color_dots=%23ebedf0,%23d1d5db,%2386efac,%2322c55e,%2315803d

      - name: Generate dark snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MindfulTechie-06
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2310B981&color_dots=%232d3343,%23334155,%23166534,%2322c55e,%2386efac

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true

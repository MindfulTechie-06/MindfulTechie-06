name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MindfulTechie-06
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2310B981&color_dots=%23ebedf0,%23d1d5db,%2386efac,%2322c55e,%2315803d
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2310B981&color_dots=%232d3343,%23334155,%23166534,%2322c55e,%2386efac

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

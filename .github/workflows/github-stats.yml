name: Update GitHub Activity Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Activity Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: MindfulTechie-06
        run: |
          mkdir -p assets

          cat > generate-stats.js <<'EOF'
          const fs = require("fs");

          const token = process.env.GITHUB_TOKEN;
          const username = process.env.GITHUB_USERNAME;

          async function githubGraphQL(query, variables = {}) {
            const response = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                query,
                variables
              })
            });

            const data = await response.json();

            if (data.errors) {
              throw new Error(JSON.stringify(data.errors));
            }

            return data.data;
          }

          function getDates(startYear, endYear) {
            const dates = [];

            for (let year = startYear; year <= endYear; year++) {
              const from = `${year}-01-01T00:00:00Z`;
              const to = `${year}-12-31T23:59:59Z`;

              dates.push({ from, to });
            }

            return dates;
          }

          async function getContributionDays() {
            const currentYear = new Date().getUTCFullYear();

            const years = getDates(currentYear - 10, currentYear);

            const allDays = [];

            for (const period of years) {
              const query = `
                query($username: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $username) {
                    contributionsCollection(from: $from, to: $to) {
                      contributionCalendar {
                        totalContributions
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const data = await githubGraphQL(query, {
                username,
                from: period.from,
                to: period.to
              });

              const weeks =
                data.user.contributionsCollection.contributionCalendar.weeks;

              for (const week of weeks) {
                for (const day of week.contributionDays) {
                  allDays.push({
                    date: day.date,
                    count: day.contributionCount
                  });
                }
              }
            }

            return allDays;
          }

          async function getTotalCommits() {
            const response = await fetch(
              `https://api.github.com/search/commits?q=author:${username}&per_page=1`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );

            const data = await response.json();

            if (data.total_count === undefined) {
              throw new Error(JSON.stringify(data));
            }

            return data.total_count;
          }

          function calculateStreaks(days) {
            const sorted = [...days].sort(
              (a, b) => new Date(a.date) - new Date(b.date)
            );

            let longest = 0;
            let current = 0;

            for (let i = 0; i < sorted.length; i++) {
              if (sorted[i].count > 0) {
                current = 1;

                for (let j = i + 1; j < sorted.length; j++) {
                  const previous = new Date(sorted[j - 1].date);
                  const next = new Date(sorted[j].date);

                  const difference =
                    (next - previous) / (1000 * 60 * 60 * 24);

                  if (difference === 1 && sorted[j].count > 0) {
                    current++;
                  } else {
                    break;
                  }
                }

                longest = Math.max(longest, current);
              }
            }

            const today = new Date();
            today.setUTCHours(0, 0, 0, 0);

            const yesterday = new Date(today);
            yesterday.setUTCDate(yesterday.getUTCDate() - 1);

            const byDate = new Map(
              sorted.map(day => [day.date, day.count])
            );

            let currentStreak = 0;

            let checkDate = today;

            const todayString = checkDate.toISOString().split("T")[0];

            if (!byDate.has(todayString) || byDate.get(todayString) === 0) {
              checkDate = yesterday;
            }

            while (true) {
              const dateString =
                checkDate.toISOString().split("T")[0];

              if (!byDate.has(dateString) || byDate.get(dateString) === 0) {
                break;
              }

              currentStreak++;

              checkDate.setUTCDate(checkDate.getUTCDate() - 1);
            }

            return {
              current: currentStreak,
              longest
            };
          }

          function createSVG(totalCommits, currentStreak, longestStreak) {
            return `
          <svg width="1000" height="230" viewBox="0 0 1000 230"
               xmlns="http://www.w3.org/2000/svg">

            <rect width="1000" height="230"
                  rx="14"
                  fill="#0D1117"
                  stroke="#30363D"/>

            <line x1="333" y1="30" x2="333" y2="200"
                  stroke="#30363D"/>

            <line x1="666" y1="30" x2="666" y2="200"
                  stroke="#30363D"/>

            <!-- TOTAL COMMITS -->

            <text x="166" y="65"
                  text-anchor="middle"
                  fill="#F0F6FC"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="700">
              📊 TOTAL COMMITS
            </text>

            <text x="166" y="135"
                  text-anchor="middle"
                  fill="#58A6FF"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="48"
                  font-weight="700">
              ${totalCommits}
            </text>

            <!-- CURRENT STREAK -->

            <text x="500" y="65"
                  text-anchor="middle"
                  fill="#F0F6FC"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="700">
              🔥 CURRENT STREAK
            </text>

            <text x="500" y="135"
                  text-anchor="middle"
                  fill="#F78166"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="48"
                  font-weight="700">
              ${currentStreak}
            </text>

            <!-- LONGEST STREAK -->

            <text x="833" y="65"
                  text-anchor="middle"
                  fill="#F0F6FC"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="22"
                  font-weight="700">
              🏆 LONGEST STREAK
            </text>

            <text x="833" y="135"
                  text-anchor="middle"
                  fill="#A371F7"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="48"
                  font-weight="700">
              ${longestStreak}
            </text>

            <text x="166" y="175"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="14">
              GitHub contributions
            </text>

            <text x="500" y="175"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="14">
              consecutive days
            </text>

            <text x="833" y="175"
                  text-anchor="middle"
                  fill="#8B949E"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="14">
              best streak
            </text>

          </svg>
          `;
          }

          async function main() {
            console.log("Fetching GitHub data...");

            const days = await getContributionDays();
            const totalCommits = await getTotalCommits();

            const streaks = calculateStreaks(days);

            console.log("Total commits:", totalCommits);
            console.log("Current streak:", streaks.current);
            console.log("Longest streak:", streaks.longest);

            const svg = createSVG(
              totalCommits,
              streaks.current,
              streaks.longest
            );

            fs.writeFileSync(
              "assets/github-activity.svg",
              svg.trim()
            );

            console.log("GitHub activity card generated.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node generate-stats.js

          rm generate-stats.js

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-activity.svg

          git diff --cached --quiet || git commit -m "Update GitHub activity statistics"

          git push
